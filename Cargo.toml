[workspace]
members = ["crates/content-compiler", "crates/md-compiler", "packages/content-compiler-napi"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.4"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
comrak = { version = "0.59", default-features = false }
garden-content-compiler = { path = "crates/content-compiler" }
garden-md-compiler = { path = "crates/md-compiler" }
katex_rs = { package = "katex-rs", version = "0.3.0" }
napi = { version = "3.16.2", default-features = false, features = ["napi4"] }
napi-build = "2.6.0"
napi-derive = "3.7.1"
rayon = "1.12"
